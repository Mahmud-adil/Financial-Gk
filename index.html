function fixBn(s){
  return String(s)
    .replace(/([\u0980-\u09FF])\s+([\u09BC-\u09CC\u09D7\u0981-\u0983])/g,'$1$2')
    .replace(/\s+/g,' ')
    .trim();
}
var Q=[],EXP={},IDX={};
RAW.split('\n').forEach(function(line){
  line=line.trim();
  if(!line) return;
  var p=line.split('|');
  if(p.length===2){ EXP[p[0]]=fixBn(p[1]); return; }
  if(p.length!==7) return;
  var L=p[6].trim().toUpperCase();
  var a=(L.length===1)?'ABCD'.indexOf(L):-1;
  var x={id:+p[0],q:fixBn(p[1]),o:[fixBn(p[2]),fixBn(p[3]),fixBn(p[4]),fixBn(p[5])],a:a};
  Q.push(x); IDX[x.id]=x;
});

function E(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function stat(items){
  var c=0,w=0,n=0,tot=0;
  items.forEach(function(x){
    if(x.a<0) return; tot++;
    var v=prog[x.id];
    if(v===true)c++; else if(v===false)w++; else n++;
  });
  return {c:c,w:w,n:n,tot:tot,pct:tot?Math.round(c*100/tot):0};
}
function ring(pct,col,label,size){
  size=size||84;
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px;background:conic-gradient('+col+' '+(pct*3.6)+'deg,#3d3775 0)"><div class="rin">'+label+'</div></div>';
}
function fmt(ms){
  if(ms<0) ms=0;
  var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sc=s%60;
  var p=function(n){return (n<10?'0':'')+n;};
  return (h>0? h+':' : '')+p(m)+':'+p(sc);
}
function keyWord(t){
  t=String(t);
  var m=t.match(/\b[A-Z][A-Za-z]{3,}\b/); if(m) return m[0];
  m=t.match(/'([^']+)'/); if(m) return m[1];
  m=t.match(/word\s+(\S+)/i); if(m) return m[1];
  return t;
}
function speak(t){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(keyWord(t));
    u.lang='en-US';
    speechSynthesis.speak(u);
  }catch(e){}
}
function poolOf(src){
  var base;
  if(src==='all') base=Q;
  else if(src.indexOf('set')===0) base=SETS[+src.slice(3)].items;
  else if(src==='wrong') base=Q.filter(function(x){return prog[x.id]===false;});
  else base=Q.filter(function(x){return bm[x.id];});
  return base.filter(function(x){return x.a>=0;});
}
function shuffleSample(arr,n,doShuffle){
  var a=arr.slice();
  if(doShuffle){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } }
  return a.slice(0,n);
}
function startIdx(items,n){
  if(n==null) return 0;
  for(var i=0;i<items.length;i++){ if(items[i].id>=n) return i; }
  return 0;
}
function startNum(){
  var el=document.getElementById('startInp');
  var n=parseInt(el&&el.value,10);
  return isNaN(n)?null:n;
}
function optsHTML(x,mark,chosen,act){
  return x.o.map(function(t,k){
    var c='opt';
    if(mark&&k===x.a) c+=' ok';
    if(chosen===k){ if(mark&&k!==x.a) c+=' bad'; else if(!mark) c+=' sel'; }
    if(!act) c+=' dis';
    return '<div class="'+c+'"'+(act?' data-a="'+act+'" data-v="'+k+'"':'')+'><b>'+'ABCD'[k]+'.</b><span class="ot">'+E(t)+'</span><button class="ib" data-a="spkO" data-v="'+E(t)+'">🔊</button></div>';
  }).join('');
}
function ansBox(x){
  var h='';
  if(x.a<0) h+='<div class="note">⚠️ সোর্সে সঠিক উত্তর নেই</div>';
  else h+='<div class="ansl">✅ সঠিক উত্তর: ('+'ABCD'[x.a]+') '+E(x.o[x.a])+'</div>';
  var ex=EXP[x.id];
  h+='<div class="exp"><b>ব্যাখ্যা</b><div>'+(ex?E(ex):'<i>এই প্রশ্নের ব্যাখ্যা PDF-এর টেক্সট-স্তর থেকে পাওয়া যায়নি।</i>')+'</div></div>';
  return h;
}

/* ================= NAVIGATION ================= */
function openRead(items,idx,back){
  S.list=items; S.idx=idx; S.show=false; S.scr='read'; S.tab='qbank'; S.back=back||'home';
  render();
}
function startPrac(ids,back){
  if(!ids.length){ S.msg='এই তালিকায় অনুশীলনের প্রশ্ন নেই'; render(); return; }
  S.p={ids:ids,i:0,c:0,n:0,wrong:[],ans:{},sel:{}};
  S.scr='prac'; S.tab='qbank'; S.back=back||'home';
  render();
}
function goBack(){
  if(S.back==='bm'){ S.tab='bm'; }
  else if(S.back==='set'){ S.tab='qbank'; S.scr='set'; }
  else if(S.back==='mock'){ S.tab='mock'; }
  else { S.tab='qbank'; S.scr='home'; }
  S.p=null;
  render();
}
function startMock(ids,sec,neg,label){
  S.mock={ids:ids,i:0,ans:{},sec:sec,neg:neg,t0:Date.now(),total:ids.length*sec*1000,label:label};
  if(!S.tick) S.tick=setInterval(tick,250);
  render();
}
function tick(){
  if(!S.mock){ if(S.tick){clearInterval(S.tick); S.tick=null;} return; }
  var left=S.mock.total-(Date.now()-S.mock.t0);
  var el=document.getElementById('mtimer');
  if(el) el.textContent=fmt(left);
  if(left<=0) finishMock();
}
function finishMock(){
  var M=S.mock; if(!M) return;
  var c=0,w=0,s=0,wrong=[];
  M.ids.forEach(function(id){
    var x=byId(id), a=M.ans[id];
    if(a===undefined){ s++; return; }
    if(a===x.a){ c++; prog[id]=true; }
    else { w++; wrong.push({id:id,u:a}); prog[id]=false; }
  });
  var score=Math.round((c-w*M.neg)*100)/100;
  var res={score:score,c:c,w:w,s:s,n:M.ids.length,wrong:wrong,label:M.label};
  hist.unshift({d:new Date().toISOString(),score:score,c:c,w:w,s:s,n:res.n});
  if(hist.length>50) hist.length=50;
  save('qb_hist',hist); save('qb_prog',prog);
  S.mock=null; S.mres=res;
  render();
}

document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-a]'):null;
  if(!el) return;
  var a=el.getAttribute('data-a'), v=el.getAttribute('data-v');

  if(a==='spkO'||a==='spkQ'){ e.stopPropagation(); speak(v); return; }

  if(a==='tab'){ S.tab=v; if(v==='qbank'&&S.scr==='read') S.scr='home'; render(); return; }
  if(a==='openSet'){ S.si=+v; S.scr='set'; S.tab='qbank'; render(); return; }
  if(a==='home'){ S.scr='home'; S.tab='qbank'; S.p=null; render(); return; }
  if(a==='back'){ goBack(); return; }

  if(a==='readSet'){ var items=SETS[S.si].items; openRead(items,startIdx(items,startNum()),'set'); return; }
  if(a==='pracSet'){ var n1=startNum(); startPrac(SETS[S.si].items.filter(function(x){return x.a>=0&&(n1==null||x.id>=n1);}).map(function(x){return x.id;}),'set'); return; }
  if(a==='pracWrongSet'){ startPrac(SETS[S.si].items.filter(function(x){return x.a>=0&&prog[x.id]===false;}).map(function(x){return x.id;}),'set'); return; }
  if(a==='mockSet'){ S.msrc='set'+S.si; S.tab='mock'; render(); return; }
  if(a==='readQ'){ openRead(Q,+v,'home'); return; }

  if(a==='toggleAns'){ S.show=!S.show; render(); return; }
  if(a==='prev'){ if(S.idx>0){ S.idx--; S.show=S.show; } render(); return; }
  if(a==='next'){ if(S.idx<S.list.length-1){ S.idx++; } render(); return; }
  if(a==='bm'){ var bid=+v; if(bm[bid]) delete bm[bid]; else bm[bid]=1; save('qb_bm',bm); render(); return; }

  if(a==='pick'){
    var P=S.p; if(!P) return;
    var x=byId(P.ids[P.i]); if(P.ans[x.id]) return;
    var k=+v, ok=(k===x.a);
    P.n++; if(ok) P.c++; else P.wrong.push(x.id);
    P.ans[x.id]='sel'; P.sel[x.id]=k;
    prog[x.id]=ok; save('qb_prog',prog);
    render(); return;
  }
  if(a==='reveal'){ var P2=S.p; if(!P2) return; var x2=byId(P2.ids[P2.i]); P2.ans[x2.id]='rev'; render(); return; }
  if(a==='pnext'){ var P3=S.p; if(!P3) return; P3.i++; render(); return; }
  if(a==='pracWrongP'){ var ids=S.p?S.p.wrong.slice():[]; startPrac(ids,S.back); return; }

  if(a==='bmRead'){ var BL=Q.filter(function(x){return bm[x.id];}); openRead(BL,+v,'bm'); return; }
  if(a==='readBm'){ var BL2=Q.filter(function(x){return bm[x.id];}); openRead(BL2,0,'bm'); return; }
  if(a==='bmPrac'){ var BL3=Q.filter(function(x){return bm[x.id];}).slice(+v).filter(function(x){return x.a>=0;}).map(function(x){return x.id;}); startPrac(BL3,'bm'); return; }
  if(a==='pracBm'){ startPrac(Q.filter(function(x){return bm[x.id]&&x.a>=0;}).map(function(x){return x.id;}),'bm'); return; }

  if(a==='pracWrongAll'){ startPrac(Q.filter(function(x){return x.a>=0&&prog[x.id]===false;}).map(function(x){return x.id;}),'home'); return; }
  if(a==='resetAsk'){
    var ok2=true; try{ ok2=window.confirm('সব অগ্রগতি ও Mock ইতিহাস মুছে যাবে। নিশ্চিত?'); }catch(err){}
    if(ok2){ prog={}; hist=[]; save('qb_prog',prog); save('qb_hist',hist); render(); }
    return;
  }

  if(a==='mStart'){
    var src=(document.getElementById('msrc')||{}).value||'all';
    var n=parseInt((document.getElementById('mn')||{}).value,10);
    var sec=Math.max(5,parseInt((document.getElementById('msec')||{}).value,10)||30);
    var neg=Math.max(0,parseFloat((document.getElementById('mneg')||{}).value)||0);
    cfg={sec:sec,neg:neg}; save('qb_cfg',cfg);
    S.msrc=src;
    var pool=poolOf(src);
    if(!pool.length){ S.msg='এই উৎসে কোনো প্রশ্ন নেই (ভুল/বুকমার্ক খালি)'; render(); return; }
    if(isNaN(n)||n<1) n=pool.length;
    n=Math.min(n,pool.length);
    var picked=shuffleSample(pool,n,src==='all'||src==='wrong'||src==='bm').map(function(x){return x.id;});
    S.msg='';
    startMock(picked,sec,neg,(src==='all'?'সব প্রশ্ন':src));
    return;
  }
  if(a==='mGo'){ S.mock.i=+v; render(); return; }
  if(a==='mPrev'){ if(S.mock.i>0) S.mock.i--; render(); return; }
  if(a==='mNext'){ if(S.mock.i<S.mock.ids.length-1) S.mock.i++; render(); return; }
  if(a==='mPick'){
    var M=S.mock, idq=M.ids[M.i], kk=+v;
    if(M.ans[idq]===kk) delete M.ans[idq]; else M.ans[idq]=kk;
    render(); return;
  }
  if(a==='mClear'){ delete S.mock.ans[S.mock.ids[S.mock.i]]; render(); return; }
  if(a==='mSubmit'){
    var okS=true; try{ okS=window.confirm('Submit করবেন?'); }catch(err2){}
    if(okS) finishMock();
    return;
  }
  if(a==='closeRes'){ S.mres=null; render(); return; }
  if(a==='mGoRes'){ return; }
  if(a==='pracMockWrong'){
    var wids=S.mres.wrong.map(function(w){return w.id;});
    S.mres=null; startPrac(wids,'mock');
    return;
  }
});

document.addEventListener('input',function(e){
  if(e.target && e.target.id==='qs'){
    S.q=e.target.value;
    var box=document.getElementById('sres');
    if(box) box.innerHTML=sresHTML();
  }
});

var tsx=null;
document.addEventListener('touchstart',function(e){
  var el=e.target.closest?e.target.closest('[data-swipe="1"]'):null;
  tsx=(el&&S.scr==='read')?e.touches[0].clientX:null;
},{passive:true});
document.addEventListener('touchend',function(e){
  if(tsx===null) return;
  var dx=e.changedTouches[0].clientX-tsx;
  tsx=null;
  if(Math.abs(dx)>60){
    if(dx<0){ if(S.idx<S.list.length-1) S.idx++; }
    else { if(S.idx>0) S.idx--; }
    render();
  }
},{passive:true});

/* ================= INIT ================= */
if(S.tab==='mock'){} /* no-op */
render();
})();
</script>
<style>
/* extra styles for overlay controls */
.mtop small{color:#ffd9a8}
</style>
</body>
